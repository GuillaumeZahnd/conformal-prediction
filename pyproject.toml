[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-prediction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pytest>=9.1.1",
    "seaborn>=0.13.2",
    "torch>=2.0",
]

[project.optional-dependencies]
examples = ["hydra-core>=1.3.7", "matplotlib", "scikit-learn", "torchvision"]

[dependency-groups]
dev = [
    "pytest",
    "pyright",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conformal_prediction = ["py.typed"]
